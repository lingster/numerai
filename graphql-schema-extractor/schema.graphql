type RootMutationType {
  """Merge another account into the current one using a token"""
  absorbAccount(token: String!): String
  """Mark the authenticated account as having accepted the Terms of Service"""
  acceptTos(accepted: Boolean = true): Boolean
  """Create a new model in a tournament"""
  addModel(
    name: String!
    tournament: Int!
  ): Model
  """Archive a model to hide it from public view and exclude from model limits"""
  archiveModel(modelId: ID!): Model
  """Assign an uploaded pickle to a model"""
  assignPickleToModel(
    modelId: String
    pickleId: ID
  ): String
  """Cancel a pending stake release"""
  cancelPendingStakeRelease(modelId: ID!): V2ChangeStakeRequest
  """Change the account email (password check required)"""
  changeEmail(
    code: String
    newEmail: String!
    password: String!
  ): Boolean
  """Change password for the authenticated account"""
  changePassword(
    code: String
    newPassword: String!
    password: String!
  ): Session
  """Confirm account creation with a token and start session"""
  confirmCreateUser(token: String!): Session
  """Create a new API token with scopes"""
  createApiToken(
    code: String
    name: String!
    password: String!
    scopes: [String]!
  ): ApiTokenWithSecret
  """Create a compute pickle upload record and presigned URL"""
  createComputePickleUpload(
    dataVersionId: ID
    dockerImageId: ID
    filename: String!
    modelId: ID
    source: String
    tournament: Int!
  ): ComputePickleUpload
  """Register a diagnostics upload"""
  createDiagnostics(
    filename: String!
    modelId: ID
    tournament: Int!
